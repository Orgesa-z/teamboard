<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teamboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Teamboard</h1>
  <p id="who"></p>
  <button id="logout" hidden>Log out</button>
</header>

<section id="auth" hidden>
  <h2>Sign in to the board</h2>
  <form id="authForm">
    <label>Username <input id="username" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <p id="authError" role="alert"></p>
    <div class="row">
      <button type="submit" data-mode="login">Log in</button>
      <button type="submit" data-mode="signup" class="ghost">Create account</button>
    </div>
  </form>
</section>

<div id="app" hidden>
  <div id="bar">
    <select id="boardSelect" aria-label="Choose a board"></select>
    <form id="newBoard">
      <input id="newBoardName" maxlength="40" placeholder="New board name" autocomplete="off">
      <button>Create board</button>
    </form>
  </div>
  <div id="boardTools" hidden>
    <p id="members"></p>
    <form id="invite" hidden>
      <input id="inviteName" placeholder="Invite by username" autocomplete="off">
      <button>Invite</button>
    </form>
    <button id="delBoard" hidden>Delete board</button>
  </div>
  <p id="msg" role="status"></p>
  <div id="boardArea" hidden>
    <form id="add">
      <input id="text" maxlength="140" placeholder="What needs doing?" autocomplete="off">
      <button>Add note</button>
    </form>
    <main>
      <section data-col="todo"><h2>To do</h2><div class="list"></div></section>
      <section data-col="doing"><h2>In progress</h2><div class="list"></div></section>
      <section data-col="done"><h2>Done</h2><div class="list"></div></section>
    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
